<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Analyzer - {% block title %} {% endblock %}</title>
    <!-- Google Fonts: Roboto & Playfair Display -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }
        h1, h2, h3, .navbar-brand {
            font-family: 'Playfair Display', serif;
            color: #d4af37; /* Dourado */
        }
        .bg-felt {
            background-color: #0f4024; /* Verde Feltro de Poker */
        }
        .card-poker {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-gold {
            background-color: #d4af37;
            color: #121212;
            font-weight: bold;
            border: none;
        }
        .btn-gold:hover {
            background-color: #bfa030;
            color: #000;
        }
    </style>
</head>
<body>
    {% include 'games/nav.html' %}
    
    <div class="container py-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
