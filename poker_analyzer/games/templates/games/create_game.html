{% extends 'games/base.html' %}
{% load crispy_forms_tags %}

{% block title %} Novo Jogo {% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card card-poker p-4 shadow">
            <div class="text-center mb-4">
                <i class="bi bi-suit-diamond-fill text-danger fs-1"></i>
                <h3 class="mt-2 text-light">Abrir Nova Mesa</h3>
            </div>
            
            <form action="" method="post">
                {% csrf_token %}
                
                <div class="mb-4">
                    {{ form|crispy }}
                </div>
                
                <div class="d-grid">
                    <button name="submit" class="btn btn-gold btn-lg">
                        Iniciar Partida <i class="bi bi-play-fill"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
