{% extends 'games/base.html' %}

{% block title %} Encerrar Mesa {% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-poker p-4">
            <div class="text-center mb-4">
                <h2 class="text-danger"><i class="bi bi-exclamation-triangle"></i> Fim de Jogo</h2>
                <p class="text-muted">Insira o valor final de fichas de cada jogador para fechar o caixa da mesa.</p>
            </div>

            <form action="" method="post">
                {% csrf_token %}
                
                <div class="list-group mb-4">
                    {% for session in players %}
                        <div class="list-group-item bg-dark border-secondary d-flex justify-content-between align-items-center p-3">
                            <label class="form-label mb-0 fs-5 text-light">{{ session.player.name }}</label>
                            <div class="input-group" style="width: 150px;">
                                <span class="input-group-text bg-secondary border-secondary text-light">$</span>
                                <input type="number" name="chips_{{ session.id }}" class="form-control bg-light text-dark" required placeholder="0">
                            </div>
                        </div>
                    {% endfor %}
                </div>

                <div class="d-grid">
                    <button type="submit" name="submit" class="btn btn-danger btn-lg">
                        <i class="bi bi-calculator"></i> Calcular e Encerrar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
